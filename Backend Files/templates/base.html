<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}AI-powered interview platform for students and HR professionals{% endblock %}">
    <title>{% block title %}TalentSync{% endblock %}</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AI Interview Pro Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pro-theme.css') }}">
    {% block additional_css %}{% endblock %}
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    
    <!-- Navigation -->
    {% include 'components/navbar.html' %}
    
    <!-- Flash Messages -->
    {% include 'components/alerts.html' %}
    
    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    {% include 'components/footer.html' %}
    
    <!-- Modern Loading Spinner -->
    <div id="loading-spinner" class="d-none">
        <div class="spinner-overlay">
            <div class="loading-content">
                <div class="spinner-modern"></div>
                <div class="loading-text mt-3">Loading...</div>
            </div>
        </div>
    </div>
    
    <!-- Modern Confirmation Modal -->
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <div class="d-flex align-items-center">
                        <div class="modal-icon me-3" style="width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--warning-100); display: flex; align-items: center; justify-content: center;">
                            <i class="fas fa-exclamation-triangle" style="color: var(--warning-600); font-size: 1.2rem;"></i>
                        </div>
                        <h5 class="modal-title mb-0" id="confirmationModalLabel" style="font-weight: 600; color: #1a202c;">Confirm Action</h5>
                    </div>
                    <button type="button" class="btn-close-modern" data-bs-dismiss="modal" aria-label="Close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body pt-0">
                    <p id="confirmation-message" class="mb-0" style="color: #4a5568; font-size: var(--text-sm); line-height: 1.6;">Are you sure you want to proceed?</p>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirm-action">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript Libraries -->
    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- jQuery (for easier DOM manipulation) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    <!-- Page-specific JavaScript -->
    {% block additional_js %}{% endblock %}
    
    <!-- Global JavaScript Variables -->
    <script>
        // Global configuration
        window.APP_CONFIG = {
            baseUrl: '{{ request.url_root }}',
            userId: {% if current_user.is_authenticated %}'{{ current_user.id }}'{% else %}null{% endif %},
            userType: {% if current_user.is_authenticated %}'{{ current_user.user_type }}'{% else %}null{% endif %},
            csrfToken: '{{ csrf_token() if csrf_token else "" }}'
        };
        
        // Enhanced utility functions
        window.showLoading = function(message = 'Loading...') {
            const spinner = document.getElementById('loading-spinner');
            const loadingText = spinner.querySelector('.loading-text');
            if (loadingText) loadingText.textContent = message;
            spinner.classList.remove('d-none');
            document.body.style.overflow = 'hidden';
        };
        
        window.hideLoading = function() {
            document.getElementById('loading-spinner').classList.add('d-none');
            document.body.style.overflow = '';
        };
        
        window.showConfirmation = function(message, callback, options = {}) {
            const modal = document.getElementById('confirmationModal');
            const messageEl = document.getElementById('confirmation-message');
            const titleEl = document.getElementById('confirmationModalLabel');
            const confirmBtn = document.getElementById('confirm-action');
            const iconEl = modal.querySelector('.modal-icon i');
            
            messageEl.textContent = message;
            titleEl.textContent = options.title || 'Confirm Action';
            confirmBtn.textContent = options.confirmText || 'Confirm';
            
            const type = options.type || 'warning';
            const iconConfig = {
                'warning': { icon: 'fas fa-exclamation-triangle', bg: 'var(--warning-100)', color: 'var(--warning-600)' },
                'danger': { icon: 'fas fa-exclamation-circle', bg: 'var(--error-100)', color: 'var(--error-600)' },
                'info': { icon: 'fas fa-info-circle', bg: 'var(--primary-100)', color: 'var(--primary-600)' }
            };
            
            const config = iconConfig[type] || iconConfig['warning'];
            iconEl.className = config.icon;
            iconEl.style.color = config.color;
            iconEl.parentElement.style.background = config.bg;
            
            confirmBtn.className = `btn btn-${type === 'danger' ? 'danger' : 'primary'}`;
            
            const modalInstance = new bootstrap.Modal(modal);
            modalInstance.show();
            
            confirmBtn.onclick = function() {
                modalInstance.hide();
                if (callback) callback();
            };
        };
        
        // Flash message auto-hide
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert:not(.alert-permanent)');
            alerts.forEach(function(alert) {
                if (alert.classList.contains('alert-success') || alert.classList.contains('alert-info')) {
                    setTimeout(function() {
                        alert.style.opacity = '0';
                        setTimeout(function() {
                            alert.remove();
                        }, 300);
                    }, 5000);
                }
            });
        }, 100);
        
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
        
        // Enhanced page interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Add loading states to forms
            const forms = document.querySelectorAll('form');
            forms.forEach(form => {
                form.addEventListener('submit', function() {
                    const submitBtn = form.querySelector('button[type="submit"], input[type="submit"]');
                    if (submitBtn && !submitBtn.disabled) {
                        submitBtn.disabled = true;
                        const originalText = submitBtn.textContent || submitBtn.value;
                        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
                        
                        setTimeout(() => {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalText;
                        }, 10000);
                    }
                });
            });
        });
    </script>
    
    <style>
        .loading-content { text-align: center; }
        .loading-text { color: #4a5568; font-size: var(--text-sm); font-weight: 500; }
        .btn-close-modern { background: none; border: none; width: 32px; height: 32px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; color: #718096; transition: all var(--transition-fast); cursor: pointer; }
        .btn-close-modern:hover { background: #f7fafc; color: #2d3748; }
        .btn-close-modern i { font-size: 0.875rem; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn .fa-spinner { animation: spin 1s linear infinite; }
        .btn, .card, .form-control, .nav-link { transition: all var(--transition-fast); }
        .btn:focus, .form-control:focus, .nav-link:focus { outline: 2px solid var(--primary-500); outline-offset: 2px; }
    </style>
</body>
</html>
