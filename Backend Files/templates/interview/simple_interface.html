{% extends "base.html" %}

{% block title %}Practice Interview{% endblock %}

{% block additional_css %}
<style>
body {
    font-family: 'Inter', sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 0;
}

.interview-container {
    max-width: 800px;
    margin: 2rem auto;
    padding: 2rem;
    background: #1e293b;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.interview-header {
    text-align: center;
    margin-bottom: 2rem;
}

.interview-title {
    font-size: 2rem;
    font-weight: 700;
    color: #3b82f6;
    margin-bottom: 0.5rem;
}

.question-section {
    background: rgba(59, 130, 246, 0.1);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    border: 1px solid rgba(59, 130, 246, 0.2);
}

.question-number {
    font-size: 0.9rem;
    color: #94a3b8;
    margin-bottom: 1rem;
}

.question-text {
    font-size: 1.2rem;
    line-height: 1.6;
    color: #e2e8f0;
    margin-bottom: 2rem;
}

.answer-section {
    background: rgba(16, 185, 129, 0.1);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.recording-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    color: #6ee7b7;
}

.answer-display {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 1rem;
    min-height: 100px;
    margin-bottom: 1rem;
}

.answer-text {
    color: #cbd5e1;
    font-size: 1rem;
    line-height: 1.4;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 2rem;
}

.btn {
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-primary {
    background: #3b82f6;
    color: white;
}

.btn-success {
    background: #10b981;
    color: white;
}

.btn-secondary {
    background: #6b7280;
    color: white;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.progress {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    height: 8px;
    margin-bottom: 2rem;
    overflow: hidden;
}

.progress-bar {
    background: #3b82f6;
    height: 100%;
    transition: width 0.3s ease;
}

.recording {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
</style>
{% endblock %}

{% block content %}
<div class="interview-container">
    <div class="interview-header">
        <div class="interview-title">Practice Interview</div>
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
    </div>

    <div class="question-section">
        <div class="question-number" id="questionNumber">Question 1 of 5</div>
        <div class="question-text" id="questionText">
            Tell me about yourself and your background.
        </div>
    </div>

    <div class="answer-section">
        <div class="recording-status" id="recordingStatus">
            <i class="fas fa-microphone"></i> Ready to record
        </div>
        <div class="answer-display">
            <div class="answer-text" id="answerText">
                Click "Start Recording" and speak your answer...
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="recordBtn">
            <i class="fas fa-microphone"></i> Start Recording
        </button>
        <button class="btn btn-success" id="nextBtn" style="display: none;">
            <i class="fas fa-arrow-right"></i> Next Question
        </button>
        <button class="btn btn-secondary" id="finishBtn" style="display: none;">
            <i class="fas fa-check"></i> Finish Interview
        </button>
    </div>
</div>

<script>
class SimpleInterview {
    constructor(sessionId) {
        this.sessionId = sessionId;
        this.currentQuestion = 0;
        this.isRecording = false;
        this.recognition = null;
        this.answers = [];
        
        this.questions = [
            "Tell me about yourself and your background.",
            "What interests you about this role?",
            "Describe a challenging project you've worked on.",
            "How do you handle working under pressure?",
            "Do you have any questions for us?"
        ];
        
        this.initializeElements();
        this.initializeVoiceRecognition();
        this.initializeEventListeners();
    }
    
    initializeElements() {
        this.elements = {
            questionNumber: document.getElementById('questionNumber'),
            questionText: document.getElementById('questionText'),
            recordingStatus: document.getElementById('recordingStatus'),
            answerText: document.getElementById('answerText'),
            recordBtn: document.getElementById('recordBtn'),
            nextBtn: document.getElementById('nextBtn'),
            finishBtn: document.getElementById('finishBtn'),
            progressBar: document.getElementById('progressBar')
        };
    }
    
    initializeVoiceRecognition() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            this.recognition = new SpeechRecognition();
            this.recognition.continuous = true;
            this.recognition.interimResults = true;
            this.recognition.lang = 'en-US';
            
            this.recognition.onstart = () => {
                this.isRecording = true;
                this.elements.recordBtn.innerHTML = '<i class="fas fa-stop"></i> Stop Recording';
                this.elements.recordBtn.classList.add('recording');
                this.elements.recordingStatus.innerHTML = '<i class="fas fa-microphone"></i> Listening...';
            };
            
            this.recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                this.elements.answerText.textContent = transcript || 'Speak your answer...';
            };
            
            this.recognition.onend = () => {
                this.isRecording = false;
                this.elements.recordBtn.innerHTML = '<i class="fas fa-microphone"></i> Start Recording';
                this.elements.recordBtn.classList.remove('recording');
                this.elements.recordingStatus.innerHTML = '<i class="fas fa-check-circle"></i> Recording complete';
                
                if (this.elements.answerText.textContent.trim()) {
                    this.answers[this.currentQuestion] = this.elements.answerText.textContent;
                    this.showNextButton();
                }
            };
        } else {
            this.elements.recordingStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Voice recording not supported';
        }
    }
    
    initializeEventListeners() {
        this.elements.recordBtn.addEventListener('click', () => this.toggleRecording());
        this.elements.nextBtn.addEventListener('click', () => this.nextQuestion());
        this.elements.finishBtn.addEventListener('click', () => this.finishInterview());
    }
    
    toggleRecording() {
        if (!this.recognition) return;
        
        if (this.isRecording) {
            this.recognition.stop();
        } else {
            this.recognition.start();
        }
    }
    
    showNextButton() {
        if (this.currentQuestion < this.questions.length - 1) {
            this.elements.nextBtn.style.display = 'inline-block';
        } else {
            this.elements.finishBtn.style.display = 'inline-block';
        }
    }
    
    async nextQuestion() {
        this.currentQuestion++;
        
        // Get adaptive next question based on previous answer
        const previousAnswer = this.answers[this.currentQuestion - 1];
        const nextQuestion = await this.getAdaptiveQuestion(previousAnswer);
        
        if (nextQuestion) {
            this.questions[this.currentQuestion] = nextQuestion;
        }
        
        this.updateQuestion();
        this.elements.nextBtn.style.display = 'none';
        this.elements.finishBtn.style.display = 'none';
        this.elements.answerText.textContent = 'Click "Start Recording" and speak your answer...';
        this.elements.recordingStatus.innerHTML = '<i class="fas fa-microphone"></i> Ready to record';
    }
    
    async getAdaptiveQuestion(previousAnswer) {
        try {
            const response = await fetch('/api/generate-next-question', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: this.sessionId,
                    previous_answer: previousAnswer,
                    question_number: this.currentQuestion + 1
                })
            });
            
            const data = await response.json();
            if (data.success) {
                return data.question;
            }
        } catch (error) {
            console.log('Using predefined question');
        }
        return null;
    }
    
    updateQuestion() {
        const questionNum = this.currentQuestion + 1;
        this.elements.questionNumber.textContent = `Question ${questionNum} of ${this.questions.length}`;
        this.elements.questionText.textContent = this.questions[this.currentQuestion];
        
        const progress = (questionNum / this.questions.length) * 100;
        this.elements.progressBar.style.width = progress + '%';
        
        // Speak the question
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(this.questions[this.currentQuestion]);
            utterance.rate = 0.9;
            speechSynthesis.speak(utterance);
        }
    }
    
    async finishInterview() {
        try {
            const response = await fetch(`/adaptive-interview/${this.sessionId}/complete`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    answers: this.answers,
                    completed: true
                })
            });
            
            const data = await response.json();
            if (data.success) {
                window.location.href = data.redirect_url;
            } else {
                alert('Interview completed! Redirecting to dashboard...');
                window.location.href = '/dashboard';
            }
        } catch (error) {
            alert('Interview completed! Redirecting to dashboard...');
            window.location.href = '/dashboard';
        }
    }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', function() {
    const sessionId = {{ session.id }};
    window.interview = new SimpleInterview(sessionId);
});
</script>
{% endblock %}
